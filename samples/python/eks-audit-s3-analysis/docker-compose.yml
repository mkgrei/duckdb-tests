version: '3.8'

services:
  eks-audit-analyzer:
    build: .
    container_name: eks-audit-analyzer
    ports:
      - "8000:8000"
    environment:
      # AWS Configuration
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}

      # S3 Configuration
      - S3_BUCKET=${S3_BUCKET}
      - S3_PREFIX=${S3_PREFIX:-eks-audit-logs/}

      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8000

      # DuckDB Configuration
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-4GB}
      - DUCKDB_THREADS=${DUCKDB_THREADS:-4}

    volumes:
      # Mount .env file
      - ./.env:/app/.env:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Optional: Add Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: eks-audit-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - eks-audit-analyzer
    restart: unless-stopped
    profiles:
      - with-grafana

volumes:
  grafana-data:
